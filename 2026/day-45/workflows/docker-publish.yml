name: Docker Build and Push

on:
  push:
    branches:
      - main
      - 'feature/**'
jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest .

      - name: Tag image with commit SHA
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest \
            ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:sha-${GITHUB_SHA::7}

      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:sha-${GITHUB_SHA::7}


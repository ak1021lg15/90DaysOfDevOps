name: ubuntu pre-installed software

on:
    workflow_dispatch:

jobs:
    ubuntu-job:
        runs-on: ubuntu-latest

        steps: 

            - name: Check Docker Version 
              run: docker --version 

            - name: Check Python Version 
              run: python --version 

            - name: Check Node Version 
              run: node --version 

            - name: Check Git Version 
              run: git --version

        
